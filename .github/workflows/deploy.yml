# Builds the site and deploys it to GitHub Pages.
# Settings > Pages > Build and deployment > Source must be "GitHub Actions".
#
# The site depends on fluorokit as file:../fluorokit, so the workflow checks
# out both repos side by side and builds the kit first. If the fluorokit repo
# is private, give the second checkout a token that can read it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The site has its own domain (Settings > Pages > Custom domain), so it
      # is served from the root. Without a custom domain, set this to
      # /${{ github.event.repository.name }}.
      SITE_BASE: /
    steps:
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fluorokit-site
      - name: Check out fluorokit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/fluorokit
          path: fluorokit
      - name: Build fluorokit
        run: node fluorokit/scripts/build.mjs
      - name: Install, build, and upload the site
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          path: fluorokit-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
